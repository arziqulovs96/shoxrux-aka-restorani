name: Menyu rasmlarini qidirish
on: workflow_dispatch
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/rasm_qidirish.py
      - name: Natijani alohida branchga joylash
        run: |
          cd nomzodlar
          git init -q -b rasm-nomzodlar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "nomzodlar"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" rasm-nomzodlar
